name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test and Vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run tests
        run: go test -race ./...

      - name: Run vector smoke gate
        run: go run ./internal/tools/smokevector

      - name: Run vet
        run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          # Passed through the environment rather than interpolated, so a title can
          # never reach the shell as code.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|ci|refactor|test|perf|build|revert)(\([^()]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            {
              echo "::error::The pull request title must be a conventional commit."
              echo "The squash subject becomes the commit message on main, and release-please reads it to decide the next version."
              echo "Got:      $PR_TITLE"
              echo "Examples: feat(query): add metadata ranking priors"
              echo "          fix(indexer): stop reading headings inside fenced code blocks"
            } >&2
            exit 1
          fi
          echo "Pull request title is a conventional commit: $PR_TITLE"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
